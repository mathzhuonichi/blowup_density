name: Contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make check
      - name: Preserve established contracts against the PR base
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 experiments/check_contracts.py --base-ref "$BASE_SHA"
  lean-contracts:
    needs: architecture
    runs-on: ubuntu-latest
    # The registered closure now includes PDE modules (I01.packet: ~530 local
    # modules) and the HeliCorgi port; a cold build on a 2-core runner exceeds
    # the former 25-minute limit. Local build outputs are cached below so warm
    # runs stay short; the limit covers a cold rebuild.
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free runner disk
        # The Mathlib cache plus this repository's own build outputs exceeded
        # the standard runner's free space (ENOSPC in the changed-modules
        # build). Remove preinstalled toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: Restore this repository's own Lean build outputs
        # actions/cache v4.2.3 (restore half), pinned by commit. Only our oleans
        # are cached; Mathlib still comes from its official content-addressed
        # cache. The save half runs unconditionally at the end so that a run
        # which times out or fails late still leaves its partial build for the
        # next one (actions/cache's combined action skips saving on failure).
        id: lean-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            formalization/.lake/build
            verification/.lake/build
            vendor/NavierStokesAndEuler/.lake/build
          key: lean-local-${{ runner.os }}-${{ hashFiles('formalization/lean-toolchain', 'formalization/lakefile.toml', 'verification/lakefile.toml', 'formalization/**/*.lean', 'verification/**/*.lean', 'vendor/HeliCorgi/**/*.lean', 'vendor/NavierStokesAndEuler/**/*.lean') }}
          restore-keys: |
            lean-local-${{ runner.os }}-
      - uses: leanprover/lean-action@96e06131c0e9943c780388fd166f55d1e2fa0433
        with:
          lake-package-directory: verification
          auto-config: false
          build: false
          test: true
          lint: false
          use-mathlib-cache: true
          # Repacking the full Mathlib tree exhausts the standard runner disk.
          # Mathlib's own content-addressed cache is sufficient here.
          use-github-cache: false
      - name: Compile changed modules outside the registered test closure
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 experiments/build_changed_lean.py --base-ref "$BASE_SHA"
      - name: Test rejection and refactoring behavior
        run: python3 experiments/test_contract_mutations.py --skip-build
      - name: Save this repository's own Lean build outputs
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            formalization/.lake/build
            verification/.lake/build
            vendor/NavierStokesAndEuler/.lake/build
          key: lean-local-${{ runner.os }}-${{ hashFiles('formalization/lean-toolchain', 'formalization/lakefile.toml', 'verification/lakefile.toml', 'formalization/**/*.lean', 'verification/**/*.lean', 'vendor/HeliCorgi/**/*.lean', 'vendor/NavierStokesAndEuler/**/*.lean') }}
