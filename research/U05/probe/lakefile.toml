name = "HeliCorgiProbe"
version = "0.1.0"
defaultTargets = ["Formal"]

# Pinned to the same Mathlib revision as the repository's main package
# (WT/verification/lake-manifest.json -> mathlib rev 85e3a25e...).
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"

[[lean_lib]]
name = "Formal"
globs = ["Formal.+"]
